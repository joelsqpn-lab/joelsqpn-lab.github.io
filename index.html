<!DOCTYPE html>
<html>
<head>
    <title>My GitHub Page</title>
</head>

    <style>
        body{
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
           height:100vh;
            text-align:center;
            background:black;
           
        }
         h1
    {
    color:gold;
    font-size:50px;
        animation:move 2s infinite;
        transform-origin:left;
        font-family:Cooper;
        text-shadow:0 0 20px gold;
        
    }
        @keyframes move
        {
            0%
            {
                transform:scale(1);
            }
            50%
            {
                transform:scale(1.2);
            }
            100%
            {
                transform:scale(1);
            }
        }
         p
        {
            font-size:40px;
            color:white;
            animation:fade 2s forwards;
            animation-delay:2s;
        }
       
       
        @keyframes fade
        {
            from
            {
                opacity:0;
            }
            to
            {
                opacity:1;
            }
        }
        h2
        {
            animation:show 3s forwards,move 1s infinite;
            animation-delay:2s;
        }
        @keyframes show
        {
            from
            {
                opacity:0;
                transform:translateY(30px);
            }
            to
            {
                opacity:1;
                transform:translateY(0);
            }
        }
        
        
    </style>
<body>
     <h1>I am gonna be a billionaire.</h1>
     <p>
        I will build my future with hardwork and discipline
     </p>
    <h2>😎🎶</h2>
   
</body>
</html>
