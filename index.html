<!DOCTYPE html>
<html>
<head>
    <title>My GitHub Page</title>
</head>

    <style>
        body{
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
           height:100vh;
            text-align:center;
            background:black;
           
        }
         h1
    {
    color:gold;
    font-size:50px;
        animation:move 2s infinite;
        transform-origin:left;
        font-family:Cooper;
        text-shadow:0 0 20px gold;
        
    }
        @keyframes move
        {
            0%
            {
                transform:scale(1);
            }
            50%
            {
                transform:scale(1.2);
            }
            100%
            {
                transform:scale(1);
            }
        }
         p
        {
            font-size:40px;
            color:white;
           
        }
       
       
        @keyframes fade
        {
            from
            {
                opacity:0;
            }
            to
            {
                opacity:1;
            }
        }
        h2
        {
           font-size:30px;
        }
        @keyframes show
        {
            from
            {
                opacity:0;
                transform:translateY(30px);
            }
            to
            {
                opacity:1;
                transform:translateY(0);
            }
        }
    .box
        {
            animation:show 1.5s forwards;
            opacity:0;
        }
        .one 
        {
            animation-delay:2s;
        }
        .two
        {
            animation-delay:4s;
        }
       .three
{
  animation-delay:4s;
    animation-name:show,move;
    animation-duration:1.5s,1s;
    animation-iteration-count:1,infinite;
}
        
        
    </style>
<body>
    <div class="box one">
    <h1>I am gonna be a billionaire.</h1>
    </div>
        <div class="box two">
     <p>
        I will build my future with hardwork and discipline
     </p>
        </div>
            <div class="box three">
    <h2>😎🎶</h2>
            </div>
   
</body>
</html>
