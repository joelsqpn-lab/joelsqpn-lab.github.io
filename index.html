<!DOCTYPE html>
<html>
<head>
    <title>My GitHub Page</title>
</head>
<body>
    <h1>I am gonna be a billionaire.</h1>
    <style>
        body{
            display:flex;
            justify-content:center;
            align-items:center;
            width:100%;
            text-align:center;
            background:black;
        }
         h1
    {
    color:gold;
    font-size:50px;
        animation:move 2s infinite;
        transform-origin:left;
        font-family:Georgia;
        text-shadow:0 0 20px gold;
        
    }
        @keyframes move
        {
            0%
            {
                transform:scale(1)
            }
            50%
            {
                transform:scale(1.2)
            }
            100%
            {
                transform:scale(1)
            }
        }
         p
        {
            font-size:20px;
            animation:fade 2s;
        }
       
       
        @keyframes fade
        {
            from
            {
                opacity:0;
            }
            to
            {
                opacity:1;
            }
        }
        <h2>😎🎶</h2>
        h2
        {
            animation:move 1s infinite;
        }
        
    </style>
     <p>
        I will build my future with hardwork and discipline
    </p>
   
</body>
</html>
